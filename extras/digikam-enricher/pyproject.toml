[project]
name = "digikam-enricher"
version = "0.1.0"
description = "Selectively enrich exported XMP sidecars from an Aperture library"
requires-python = ">=3.11"
dependencies = [
    "PyExifTool>=0.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
digikam-enricher = "digikam_enricher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digikam_enricher"]